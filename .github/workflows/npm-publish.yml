name: Publish to NPM
on:
  release:
    types: [published]
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0  # Fetch all branches so the version bump can be pushed to the target branch
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          always-auth: true
          node-version: 22
          cache: 'yarn'
          registry-url: 'https://registry.npmjs.org/'
      - name: Install dependencies
        run: yarn install --immutable
      - name: Build the plugin
        run: yarn build
      - name: Get the release tag version
        id: get_version
        run: echo "VERSION=${GITHUB_REF/refs\/tags\//}" >> $GITHUB_OUTPUT
      - name: Extract pre-release tag if any
        id: extract_tag
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          if [[ $VERSION == *-* ]]; then
            # Extract everything between hyphen and last period (or end of string)
            PRETAG=$(echo $VERSION | sed -E 's/.*-([^.]+).*/\1/')
            echo "IS_PRERELEASE=true" >> $GITHUB_OUTPUT
            echo "NPM_TAG=$PRETAG" >> $GITHUB_OUTPUT
          else
            echo "IS_PRERELEASE=false" >> $GITHUB_OUTPUT
            echo "NPM_TAG=latest" >> $GITHUB_OUTPUT
          fi
      - name: Get target branch
        id: get_branch
        env:
          TARGET: ${{ github.event.release.target_commitish }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          # Push the version bump to the branch the release targets. If the release targets a
          # commit SHA instead of a branch, fall back to the default branch.
          if git show-ref --verify --quiet "refs/remotes/origin/$TARGET"; then
            TARGET_BRANCH="$TARGET"
          else
            TARGET_BRANCH="$DEFAULT_BRANCH"
          fi
          echo "Pushing version bump to $TARGET_BRANCH"
          echo "TARGET_BRANCH=$TARGET_BRANCH" >> $GITHUB_OUTPUT
      - name: Set package version
        run: npm version "${{ steps.get_version.outputs.VERSION }}" --no-git-tag-version
      - name: Publish package
        run: npm publish --access public --tag ${{ steps.extract_tag.outputs.NPM_TAG }}
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
      - name: Push version bump
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: 'chore: Bump version to ${{ steps.get_version.outputs.VERSION }}'
          file_pattern: 'package.json'
          branch: ${{ steps.get_branch.outputs.TARGET_BRANCH }}